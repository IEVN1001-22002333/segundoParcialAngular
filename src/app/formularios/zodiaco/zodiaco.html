<div class="flex justify-center items-center bg-gray-50 p-4 md:p-8 min-h-screen text-gray-800">
  <div class="bg-white shadow-xl p-6 md:p-8 border border-gray-200 rounded-2xl w-full max-w-4xl overflow-hidden">
    
    <div class="mb-8 text-center">
    </div>

    <div class="items-center gap-8 grid grid-cols-1 lg:grid-cols-2">
      
      <form [formGroup]="formulario" (ngSubmit)="Calcular()" class="space-y-4">
        
        <div>
          <label class="block mb-1 font-semibold text-gray-600 text-xs">Nombre</label>
          <input type="text" formControlName="nombre" class="block bg-gray-50 p-2.5 border border-gray-300 focus:border-purple-500 rounded-lg focus:ring-purple-500 w-full text-gray-900 text-sm" placeholder="Tu nombre" required>
        </div>

        <div class="gap-3 grid grid-cols-2">
          <div>
            <label class="block mb-1 font-semibold text-gray-600 text-xs">Apellido Paterno</label>
            <input type="text" formControlName="apellidoPaterno" class="block bg-gray-50 p-2.5 border border-gray-300 focus:border-purple-500 rounded-lg focus:ring-purple-500 w-full text-gray-900 text-sm" placeholder="Paterno">
          </div>
          <div>
            <label class="block mb-1 font-semibold text-gray-600 text-xs">Apellido Materno</label>
            <input type="text" formControlName="apellidoMaterno" class="block bg-gray-50 p-2.5 border border-gray-300 focus:border-purple-500 rounded-lg focus:ring-purple-500 w-full text-gray-900 text-sm" placeholder="Materno">
          </div>
        </div>

        <div class="gap-2 grid grid-cols-3">
          <div>
            <label class="block mb-1 font-semibold text-gray-600 text-xs">Día</label>
            <input type="number" formControlName="diaNac" class="block bg-gray-50 p-2.5 border border-gray-300 focus:border-purple-500 rounded-lg focus:ring-purple-500 w-full text-gray-900 text-sm" placeholder="Día">
          </div>
          <div>
  <label class="block mb-1 font-semibold text-gray-600 text-xs">Mes</label>
  <input
    type="number"
    formControlName="mesNac"
    min="1"
    max="12"
    placeholder="Mes"
    class="block bg-gray-50 p-2.5 border border-gray-300 focus:border-purple-500 rounded-lg focus:ring-purple-500 w-full text-gray-900 text-sm"
  />
</div>

          <div>
            <label class="block mb-1 font-semibold text-gray-600 text-xs">Año</label>
            <input type="number" formControlName="anoNac" class="block bg-gray-50 p-2.5 border border-gray-300 focus:border-purple-500 rounded-lg focus:ring-purple-500 w-full text-gray-900 text-sm" placeholder="Año">
          </div>
        </div>

        <div>
          <label class="block mb-1 font-semibold text-gray-600 text-xs">Género</label>
          <div class="flex items-center space-x-6 mt-2">
            <label class="flex items-center space-x-2 text-sm cursor-pointer">
              <input type="radio" formControlName="genero" value="Masculino" class="focus:ring-purple-500 text-purple-600">
              <span>Masculino</span>
            </label>
            <label class="flex items-center space-x-2 text-sm cursor-pointer">
              <input type="radio" formControlName="genero" value="Femenino" class="focus:ring-purple-500 text-purple-600">
              <span>Femenino</span>
            </label>
            <label class="flex items-center space-x-2 text-sm cursor-pointer">
              <input type="radio" formControlName="genero" value="Otro" class="focus:ring-purple-500 text-purple-600">
              <span>Otro</span>
            </label>
               
          </div>
        </div>

        <button type="button" (click)="Calcular()" class="bg-red-600 hover:bg-black-700 shadow-sm mt-2 px-5 py-2.5 rounded-lg w-full font-medium text-white text-sm text-center transition-colors cursor-pointer">
          Calcular Zodíaco
        </button>
      </form>

      <div class="flex flex-col justify-center items-center bg-gray-50 p-6 border border-gray-100 rounded-xl min-h-[320px] text-center">
        @if (!animal) {
          <div class="space-y-3 py-12 text-gray-400">
            <div class="flex justify-center items-center mx-auto w-16 h-16 text-xl">
              
            </div>
          </div>
        } @else {
          <div class="space-y-4 w-full animate-fade-in">
            <div class="flex justify-center items-center bg-white mx-auto p-2 border border-gray-200 w-28 h-28">
              <img [src]="imagen" [alt]="animal" class="w-20 h-20 object-contain">
            </div>

            <div>
              <h2 class="font-bold text-gray-900 text-lg">
                {{ zodiaco.nombre }} {{ zodiaco.apellidoPaterno }} {{ zodiaco.apellidoMaterno }}
              </h2>
              <p class="mt-0.5 text-gray-500 text-xs">
                {{ zodiaco.genero }} , {{ zodiaco.diaNac }}/{{ zodiaco.mesNac }}/{{ zodiaco.anoNac }}
              </p>
            </div>

            <div >
              <div>
                <span class="block font-semibold text-gray-400 text-xs uppercase">Animal</span>
                <span class="font-bold text-gray-800 text-base">{{ animal }}</span>
              </div>
              <div>
                <span class="block font-semibold text-gray-400 text-xs uppercase">Edad</span>
                <span class="font-bold text-gray-800 text-base">{{ edad }} año/s</span>
              </div>
            </div>
          </div>
        }
      </div>

    </div>

  </div>
</div>
