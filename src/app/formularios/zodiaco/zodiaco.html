<form>
    <div class="gap-6 grid md:grid-cols-2 mb-6">
        <div>
            <label for="first_name" class="block mb-2.5 font-medium text-heading text-sm">First name</label>
            <input type="text" id="first_name" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="John" required />
        </div>
        <div>
            <label for="last_name" class="block mb-2.5 font-medium text-heading text-sm">Last name</label>
            <input type="text" id="last_name" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="Doe" required />
        </div>
        <div>
            <label for="company" class="block mb-2.5 font-medium text-heading text-sm">Company</label>
            <input type="text" id="company" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="Flowbite" required />
        </div>  
        <div>
            <label for="phone" class="block mb-2.5 font-medium text-heading text-sm">Phone number</label>
            <input type="tel" id="phone" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="123-45-678" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" required />
        </div>
        <div>
            <label for="website" class="block mb-2.5 font-medium text-heading text-sm">Website URL</label>
            <input type="url" id="website" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="flowbite.com" required />
        </div>
        <div>
            <label for="visitors" class="block mb-2.5 font-medium text-heading text-sm">Unique visitors (per month)</label>
            <input type="number" id="visitors" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="" required />
        </div>
    </div>
    <div class="mb-6">
        <label for="email" class="block mb-2.5 font-medium text-heading text-sm">Email address</label>
        <input type="email" id="email" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="john.doe@company.com" required />
    </div> 
    <div class="mb-6">
        <label for="password" class="block mb-2.5 font-medium text-heading text-sm">Password</label>
        <input type="password" id="password" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="•••••••••" required />
    </div> 
    <div class="mb-6">
        <label for="confirm_password" class="block mb-2.5 font-medium text-heading text-sm">Confirm password</label>
        <input type="password" id="confirm_password" class="block bg-neutral-secondary-medium shadow-xs px-3 py-2.5 border border-default-medium focus:border-brand rounded-base focus:ring-brand w-full text-heading placeholder:text-body text-sm" placeholder="•••••••••" required />
    </div> 
    <div class="flex items-start mb-6">
        <div class="flex items-center h-5">
        <input id="remember" type="checkbox" value="" class="bg-neutral-secondary-medium border border-default-medium rounded-xs focus:ring-2 focus:ring-brand-soft w-4 h-4" required />
        </div>
        <label for="remember" class="ms-2 font-medium text-heading text-sm">I agree with the <a href="#" class="text-fg-brand hover:underline">terms and conditions</a>.</label>
    </div>
    <button type="submit" class="box-border bg-brand hover:bg-brand-strong shadow-xs px-4 py-2.5 border border-transparent rounded-base focus:outline-none focus:ring-4 focus:ring-brand-medium font-medium text-white text-sm leading-5">Submit</button>
</form>
