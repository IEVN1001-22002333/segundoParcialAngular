<div class="flex justify-center items-center bg-gray-50 p-4 md:p-8 min-h-screen text-gray-800">
  <div class="bg-white shadow-xl p-6 md:p-8 border border-gray-200 rounded-2xl w-full max-w-4xl overflow-hidden">

    <div class="flex justify-between items-center mb-6">
      <h2 class="font-bold text-gray-900 text-xl">Registros de Zodíaco</h2>
      <a routerLink="/formularios/zodiaco" class="inline-flex items-center bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-white text-sm transition-colors cursor-pointer">
        Volver
      </a>
    </div>

    <form [formGroup]="formEdicion" (ngSubmit)="guardarCambios()" class="space-y-4 bg-gray-50 mb-6 p-4 border border-gray-200 rounded-xl">
      <h3 class="font-semibold text-gray-700 text-sm">
 
      </h3>

      <div>
        <label class="block mb-1 font-semibold text-gray-600 text-xs">Nombre</label>
        <input type="text" formControlName="nombre" class="block bg-white disabled:bg-gray-100 p-2.5 border border-gray-300 focus:border-blue-500 rounded-lg focus:ring-blue-500 w-full text-gray-900 text-sm">
      </div>

      <div class="gap-2 grid grid-cols-3">
        <div>
          <label class="block mb-1 font-semibold text-gray-600 text-xs">Edad</label>
          <input type="number" formControlName="edad" min="1" max="99" class="block bg-white disabled:bg-gray-100 p-2.5 border border-gray-300 focus:border-blue-500 rounded-lg focus:ring-blue-500 w-full text-gray-900 text-sm">
        </div>
          <div>
          <label class="block mb-1 font-semibold text-gray-600 text-xs">Signo</label>
          <input type="text" formControlName="signo" class="block bg-white disabled:bg-gray-100 p-2.5 border border-gray-300 focus:border-blue-500 rounded-lg focus:ring-blue-500 w-full text-gray-900 text-sm">
        </div>
      </div>

      <div>
        <label class="block mb-1 font-semibold text-gray-600 text-xs">Género</label>
        <div class="flex items-center space-x-6 mt-2">
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="radio" formControlName="genero" value="Masculino" class="focus:ring-blue-500 text-blue-600">
            <span>Masculino</span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="radio" formControlName="genero" value="Femenino" class="focus:ring-blue-500 text-blue-600">
            <span>Femenino</span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="radio" formControlName="genero" value="Otro" class="focus:ring-blue-500 text-blue-600">
            <span>Otro</span>
          </label>
        </div>
      </div>

      <div class="flex gap-3">
        <button type="submit" [disabled]="indiceEdicion === null" class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 shadow-sm px-5 py-2.5 rounded-lg w-full font-medium text-white text-sm transition-colors cursor-pointer disabled:cursor-not-allowed">
          Guardar cambios
        </button>
        <button type="button" [disabled]="indiceEdicion === null" (click)="cancelarEdicion()" class="bg-gray-600 hover:bg-gray-700 disabled:opacity-50 shadow-sm px-5 py-2.5 rounded-lg w-full font-medium text-white text-sm transition-colors cursor-pointer disabled:cursor-not-allowed">
          Cancelar
        </button>
      </div>
    </form>

    @if (zodiacoList.length === 0) {
      <p class="py-10 text-gray-500 text-sm text-center">No hay registros almacenados.</p>
    } @else {
      <div class="overflow-x-auto">
        <table class="border border-gray-200 w-full text-sm text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-xs uppercase">
              <th class="p-3 border border-gray-200 text-center">#</th>
              <th class="p-3 border border-gray-200">Nombre Completo</th>
              <th class="p-3 border border-gray-200">Edad</th>
              <th class="p-3 border border-gray-200">Género</th>
              <th class="p-3 border border-gray-200">Signo</th>

              <th class="p-3 border border-gray-200 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (item of zodiacoList; track $index) {
              <tr class="hover:bg-gray-50">
                <td class="p-3 border border-gray-200 text-gray-600 text-center">{{ $index + 1 }}</td>
                <td class="p-3 border border-gray-200 font-medium text-gray-900">
                  {{ item.nombre }}
                </td>
                <td class="p-3 border border-gray-200 text-gray-600">
                  {{item.edad}}
                </td>
                <td class="p-3 border border-gray-200 text-gray-600">
                  {{ item.genero }}
                </td>
                 <td class="p-3 border border-gray-200 text-gray-600">
                  {{ item.signo }}
                </td>
                <td class="p-3 border border-gray-200 text-center">
                  <button type="button" (click)="editarRegistro($index)" class="bg-blue-600 hover:bg-blue-700 mr-2 px-3 py-1.5 rounded-md font-medium text-white text-xs transition-colors cursor-pointer">
                    Editar
                  </button>
                  <button type="button" (click)="eliminarRegistro($index)" class="bg-gray-600 hover:bg-gray-700 px-3 py-1.5 rounded-md font-medium text-white text-xs transition-colors cursor-pointer">
                    Eliminar
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }

  </div>
</div>
